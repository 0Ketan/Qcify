<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QuantumComposer - An interactive quantum circuit composer and statevector simulator built with React, Vite, and monospace precision." />
    <title>QuantumComposer</title>
  </head>
  <body>
    <div id="root">
      <div id="app-preloader" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #000000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        font-family: 'JetBrains Mono', monospace;
      ">
        <div style="
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 16px;
        ">
          <!-- Quantum Pulse Animation Sphere -->
          <div class="pulse-sphere" style="
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
            animation: pulse 2s infinite ease-in-out;
          "></div>
          
          <h1 style="
            color: #ffffff;
            font-size: 24px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            margin: 16px 0 8px 0;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            text-align: center;
          ">QuantumComposer</h1>
          
          <p style="
            font-family: 'Inter', sans-serif;
            color: #888888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin: 0;
          ">Created by Nitesh</p>
        </div>

        <style>
          @keyframes pulse {
            0%, 100% {
              transform: scale(0.85);
              opacity: 0.4;
              box-shadow: 0 0 10px rgba(255,255,255,0.4);
            }
            50% {
              transform: scale(1.1);
              opacity: 1;
              box-shadow: 0 0 25px rgba(255,255,255,0.9);
            }
          }
          body {
            margin: 0;
            background: #000000;
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
